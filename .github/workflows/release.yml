name: Release

on:
  push:
    branches: [main]

# Un release a la vez; no cancelar publicaciones a medias.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits/tags del PR de versión
      pull-requests: write # abrir/actualizar el PR "Version Packages"
      id-token: write # provenance de npm (firma OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Version PR o publicación
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'chore: versionar paquetes'
          title: 'chore: versionar paquetes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node genera un .npmrc que lee NODE_AUTH_TOKEN (no NPM_TOKEN)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
